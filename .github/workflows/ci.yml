name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/convergence-vite.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ > /tmp/convergence-home.html; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/convergence-vite.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/convergence-home.html
          for route in /team /waiting /dashboard /clue/1 /clue/1/success /treasure /leaderboard /organizer /organizer/dashboard /organizer/teams /organizer/clues /organizer/leaderboard /profile /not-a-real-route; do
            curl --fail --silent --show-error "http://127.0.0.1:5173${route}" > /tmp/convergence-route.html
            test -s /tmp/convergence-route.html
            grep -qi '<!doctype html' /tmp/convergence-route.html
          done
