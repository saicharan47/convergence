name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Source integrity check
        run: |
          test -f src/screens/organizer/ConvergenceStudioScreen.tsx
          test -f src/lib/convergenceFlow.ts
          test -f scripts/convergence-regression-test.mjs
          test -f supabase/migrations/20260920210000_convergence_spec_completion.sql
          test -f supabase/migrations/20260920220000_convergence_rate_limit_atomic_window.sql
      - name: Lint
        run: npm run lint
      - name: Convergence regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: convergence-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --strictPort > /tmp/convergence-vite.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ > /tmp/convergence-home.html; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/convergence-vite.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/convergence-vite.log
            exit 1
          fi
          test -s /tmp/convergence-home.html

          for route in /team /waiting /dashboard /clue/1 /clue/1/success /treasure /leaderboard /organizer /organizer/dashboard /organizer/teams /organizer/clues /organizer/control /organizer/studio /organizer/leaderboard /profile /not-a-real-route; do
            curl --fail --silent --show-error "http://127.0.0.1:5173${route}" > /tmp/convergence-route.html
            test -s /tmp/convergence-route.html
            grep -qi '<!doctype html' /tmp/convergence-route.html
          done

          if grep -Eqi '(^|[^a-z])(error|fatal|uncaught)([^a-z]|$)' /tmp/convergence-vite.log; then
            cat /tmp/convergence-vite.log
            exit 1
          fi
